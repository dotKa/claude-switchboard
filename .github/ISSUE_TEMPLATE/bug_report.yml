name: Bug report
description: Something in the extension isn't working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Never paste session keys, cookies, or export files into an issue** — they are as sensitive as passwords.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the popup…
        2. Click…
        3. …
    validations:
      required: true
  - type: input
    id: extension-version
    attributes:
      label: Extension version
      description: Shown at chrome://extensions and in the options page.
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: chrome-version
    attributes:
      label: Chrome version
      description: From chrome://version.
      placeholder: "131.0.xxxx.x"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15 / Windows 11 / Ubuntu 24.04
  - type: textarea
    id: logs
    attributes:
      label: Console logs (optional)
      description: Errors from the extension service worker or popup console (chrome://extensions → Switchboard → "service worker" / Inspect views). Redact any cookies or tokens.
      render: text
